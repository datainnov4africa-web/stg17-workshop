labs:
  d1_rag:
    day: 1
    title_en: RAG assistant
    title_fr: Assistant RAG
    team_en: pairs
    team_fr: binômes
    country: CIV
    env_en: Python in Colab, Kaggle or local; scikit-learn for the word-matching retriever, which needs no download; sentence-transformers optional for the meaning-matching one; no vector database — the corpus is small enough that one is not warranted
    env_fr: Python dans Colab, Kaggle ou en local ; scikit-learn pour le récupérateur par mots, sans téléchargement ; sentence-transformers en option pour le récupérateur sémantique ; pas de base vectorielle — le corpus est trop petit pour la justifier
    deliverable_en: A transcript of answers with the exact passages behind each one, and a retrieval evaluation separating retrieval failures from generation failures
    deliverable_fr: Un relevé de réponses avec les passages exacts qui les fondent, et une évaluation de la récupération séparant les échecs de récupération des échecs de génération
    fallback_en: A fictional five-document corpus ships with the toolkit, so no team is blocked by uncleared publications; without any model provider, the retrieval half of the laboratory still runs — and that is where most RAG problems are
    fallback_fr: Un corpus fictif de cinq documents est fourni avec la boîte à outils, donc aucune équipe n'est bloquée par des publications non validées ; sans aucun fournisseur de modèle, la moitié « récupération » du laboratoire fonctionne quand même — et c'est là que sont la plupart des problèmes du RAG
    status: draft
  d1_agent:
    day: 1
    title_en: From RAG to agent
    title_fr: Du RAG à l'agent
    team_en: pairs
    team_fr: binômes
    country: CIV
    env_en: Same environment as the RAG laboratory; four tools — retrieval, a document list, a guarded calculator and one that writes to disk. A JSON text protocol rather than native function calling, so the request-to-execution gap stays visible and the exercise runs on any provider including a local model
    env_fr: Même environnement que le laboratoire RAG ; quatre outils — récupération, liste de documents, calculatrice protégée et un outil qui écrit sur disque. Un protocole textuel JSON plutôt que l'appel de fonctions natif, pour que l'interstice demande-exécution reste visible et que l'exercice tourne sur tout fournisseur, y compris un modèle local
    deliverable_en: An audit log recording every tool the model asked for, whether policy allowed it, and the raw reply behind each request — plus the note the agent wrote once a policy permitted it
    deliverable_fr: Un journal d'audit consignant chaque outil demandé par le modèle, son autorisation par la politique, et la réponse brute derrière chaque demande — plus la note écrite par l'agent une fois une politique l'y autorisant
    fallback_en: A scripted model replays fixed replies, so the loop, the approval gate, the error recovery and the audit log are all exercised with no API key. That is deliberate rather than a consolation path — those four things are what an office writes and owns; the model is what it rents
    # Quoted: French puts a space before a colon, and an unquoted YAML scalar
    # reads " : " as a key/value separator.
    fallback_fr: "Un modèle scripté rejoue des réponses fixes : la boucle, le point d'approbation, la reprise sur erreur et le journal d'audit s'exercent donc sans clé API. C'est délibéré et non un chemin de repli — ces quatre éléments sont ce qu'un office écrit et possède ; le modèle est ce qu'il loue"
    status: draft
  d2_dashboard:
    day: 2
    title_en: Document to dashboard
    title_fr: Du document au tableau de bord
    team_en: solo
    team_fr: individuel
    country: CIV
    env_en: LLM API; Python or plain HTML/JS; the participant's own national publication; GitHub Pages
    env_fr: API LLM ; Python ou simple HTML/JS ; la publication nationale du participant ; GitHub Pages
    deliverable_en: A public dashboard URL and the extraction-verification table comparing output against the source
    deliverable_fr: Une URL publique de tableau de bord et le tableau de vérification comparant l'extraction à la source
    fallback_en: A sample publication and a static dashboard template are supplied; publishing can be done from the template alone
    fallback_fr: Une publication d'exemple et un gabarit statique de tableau de bord sont fournis ; la publication peut se faire à partir du seul gabarit
    status: phase2
  d2_benchmark:
    day: 2
    title_en: Provider benchmark
    title_fr: Benchmark des fournisseurs
    team_en: solo
    team_fr: individuel
    country: CIV
    env_en: Two API endpoints including Groq; one shared spreadsheet
    env_fr: Deux points d'accès API dont Groq ; une feuille de calcul partagée
    deliverable_en: "Three rows in the shared comparison sheet: latency, cost per thousand documents, quality score"
    deliverable_fr: "Trois lignes dans la feuille de comparaison partagée : latence, coût pour mille documents, score de qualité"
    fallback_en: The facilitator runs the benchmark live from the podium if participant keys fail
    fallback_fr: L'animateur exécute le benchmark en direct depuis le pupitre si les clés des participants échouent
    status: phase2
  d2_toolkit:
    day: 2
    title_en: Toolkit stations
    title_fr: Ateliers boîte à outils
    team_en: stations
    team_fr: ateliers tournants
    country: CIV
    env_en: Varies by station; all accessible from a browser
    env_fr: Variable selon l'atelier ; tous accessibles depuis un navigateur
    deliverable_en: Two finished artefacts per participant, one from each chosen station
    deliverable_fr: Deux productions achevées par participant, une de chaque atelier choisi
    fallback_en: Stations are independent — a station that fails costs only itself
    fallback_fr: Les ateliers sont indépendants — un atelier en panne ne coûte que lui-même
    status: phase2
  d3_ookla_worldpop:
    day: 3
    title_en: Ookla and WorldPop
    title_fr: Ookla et WorldPop
    team_en: teams
    team_fr: équipes
    country: TUN
    env_en: Python with geopandas and pyarrow; Ookla parquet tiles and WorldPop rasters mirrored locally; national administrative boundaries
    env_fr: Python avec geopandas et pyarrow ; tuiles parquet Ookla et rasters WorldPop en miroir local ; frontières administratives nationales
    deliverable_en: A population-weighted download-speed and latency indicator per first-level administrative region, one map and one quarterly series
    deliverable_fr: Un indicateur de débit descendant et de latence pondéré par la population, par région administrative de premier niveau, une carte et une série trimestrielle
    fallback_en: Pre-clipped country extracts are prepared in advance for every participating country
    fallback_fr: Des extraits pays pré-découpés sont préparés à l'avance pour chaque pays participant
    status: phase3
  d3_elasticsearch:
    day: 3
    title_en: Elasticsearch
    title_fr: Elasticsearch
    team_en: teams
    team_fr: équipes
    country: TUN
    env_en: Pre-provisioned and pre-loaded cluster, one index per country, Kibana available
    env_fr: Cluster pré-provisionné et pré-chargé, un index par pays, Kibana disponible
    deliverable_en: Five saved queries and a timing comparison against the morning's pandas approach
    deliverable_fr: Cinq requêtes enregistrées et une comparaison de temps avec l'approche pandas du matin
    fallback_en: If the cluster is unreachable, the same exercise runs locally in DuckDB with an identical query set
    fallback_fr: Si le cluster est injoignable, le même exercice tourne en local sous DuckDB avec un jeu de requêtes identique
    status: phase3
  d3_search:
    day: 3
    title_en: Search-driven exploration
    title_fr: Exploration pilotée par la recherche
    team_en: teams
    team_fr: équipes
    country: TUN
    env_en: The same cluster, or the DuckDB fallback
    env_fr: Le même cluster, ou le repli DuckDB
    deliverable_en: A search-driven exploration of connectivity by region and quarter, with the timing conclusion
    deliverable_fr: Une exploration de la connectivité par région et trimestre pilotée par la recherche, avec la conclusion sur les temps
    fallback_en: Identical query set runs in DuckDB on the same parquet files
    fallback_fr: Le jeu de requêtes identique tourne sous DuckDB sur les mêmes fichiers parquet
    status: phase3
  d4_ntl_collect:
    day: 4
    title_en: NTL collect and explore
    title_fr: NTL collecter et explorer
    team_en: teams
    team_fr: équipes
    country: CIV
    env_en: Python with rasterio and h5py; VIIRS monthly and annual subsets mirrored locally; Earth Engine account optional
    env_fr: Python avec rasterio et h5py ; sous-ensembles VIIRS mensuels et annuels en miroir local ; compte Earth Engine optionnel
    deliverable_en: A documented national raster subset and an inventory of the artefacts present in that country
    deliverable_fr: Un sous-ensemble raster national documenté et un inventaire des artefacts présents dans ce pays
    fallback_en: Pre-clipped national subsets are prepared for every participating country; the Earth Engine variant downloads nothing at all
    fallback_fr: Des sous-ensembles nationaux pré-découpés sont préparés pour chaque pays participant ; la variante Earth Engine ne télécharge rien
    status: draft
  d4_ntl_explore:
    day: 4
    title_en: NTL explore and understand
    title_fr: NTL explorer et comprendre
    team_en: teams
    team_fr: équipes
    country: CIV
    env_en: Same notebook as part 1 — steps 7 and 8
    env_fr: Même carnet que la partie 1 — étapes 7 et 8
    deliverable_en: The artefact inventory for your country, with evidence
    deliverable_fr: L'inventaire des artefacts de votre pays, avec les preuves
    fallback_en: The reference country (Côte d'Ivoire) is prepared end to end
    fallback_fr: Le pays de référence (Côte d'Ivoire) est préparé de bout en bout
    status: draft
  d4_ntl_analysis:
    day: 4
    title_en: NTL analysis
    title_fr: NTL analyse
    team_en: teams
    team_fr: équipes
    country: CIV
    env_en: rasterstats or exactextract; the panel produced in the morning
    env_fr: rasterstats ou exactextract ; le panel produit le matin
    deliverable_en: Zonal statistics table, time series, change detection between two periods, and the maps
    deliverable_fr: Tableau de statistiques zonales, séries temporelles, détection de changement entre deux périodes, et les cartes
    fallback_en: One reference country is prepared end to end and handed to any team whose national data proves incomplete
    fallback_fr: Un pays de référence est préparé de bout en bout et remis à toute équipe dont les données nationales s'avèrent incomplètes
    status: phase4
  d4_ntl_validation:
    day: 4
    title_en: NTL validation
    title_fr: NTL validation
    team_en: teams
    team_fr: équipes
    country: CIV
    env_en: The official subnational indicator brought by the team
    env_fr: L'indicateur infranational officiel apporté par l'équipe
    deliverable_en: Correlation against the official indicator, and a written limitations statement
    deliverable_fr: Corrélation avec l'indicateur officiel, et une déclaration écrite des limites
    fallback_en: A reference official indicator is supplied for the reference country
    fallback_fr: Un indicateur officiel de référence est fourni pour le pays de référence
    status: phase4
  d5_publish:
    day: 5
    title_en: Publish your work
    title_fr: Publier vos travaux
    team_en: teams
    team_fr: équipes
    country: CIV
    env_en: A GitHub account and the country-template repository
    env_fr: Un compte GitHub et le dépôt country-template
    deliverable_en: A public country repository with README, licence, metadata, GitHub Pages site and citation file
    deliverable_fr: Un dépôt pays public avec README, licence, métadonnées, site GitHub Pages et fichier de citation
    fallback_en: The template can be published as-is and populated afterwards
    fallback_fr: Le gabarit peut être publié tel quel et rempli ensuite
    status: phase5

# =============================================================================
#  Breaks — agenda data, deliberately not sessions.
#
#  tools/import_agenda.py strips these rows out of the day tables (SKIP_TITLES)
#  and notes "breaks are rendered by the site". That is right: a break must not
#  acquire a placeholder deck and notebook from tools/downloads.py, nor a line
#  in the Action-Plan mapping, nor a place in the session count.
#
#  They are still agenda facts, so they live here rather than as a literal
#  inside one generator. The day pages, the week view and the downloadable PDF
#  all read this key, so the three cannot disagree about when the coffee is.
#
#  A break earns its line only where it separates something — Day 5 closes at
#  12:45, so neither lunch nor the 16:45 coffee prints after its closing
#  ceremony. The renderers apply that rule; this file only states the facts.
#
#  Named in STG17_Workshop_Agenda_..._V18092026.docx, which schedules the 10:30
#  coffee on all five days and the 16:45 coffee on Days 1 to 4. The lunch label
#  is the site's own: the document leaves 12:30–14:00 unnamed, as it leaves the
#  14:30–14:45 gap on Day 3 unnamed.
# =============================================================================
breaks:
  "10:30–10:45":
    en: Coffee break
    fr: Pause café
  "12:30–14:00":
    en: Lunch
    fr: Déjeuner
  "16:45–17:00":
    en: Coffee break
    fr: Pause café
