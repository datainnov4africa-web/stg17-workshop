[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stg17"
version = "0.1.0"
description = "Toolkit for the STG17 workshop: Emerging Issues, Emerging Practice"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
  { name = "African Development Bank - Secretariat of STG17" },
]
keywords = ["official statistics", "night-time lights", "VIIRS", "Ookla",
            "WorldPop", "Africa", "SHaSA II", "STG17"]
classifiers = [
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: GIS",
]

# Deliberately minimal. A participant on Day 1 needs none of the geospatial
# stack, and forcing rasterio onto a locked-down Windows laptop to run a RAG
# notebook is how an installation becomes a lost morning. Each notebook
# installs its own requirements in its first cell.
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "matplotlib>=3.7",
]

[project.optional-dependencies]
geo = ["geopandas>=0.14", "rasterio>=1.3", "shapely>=2.0", "h5py>=3.9", "pyarrow>=14.0"]
gee = ["earthengine-api>=0.1.380", "geemap>=0.30"]
ai  = ["sentence-transformers>=2.5", "faiss-cpu>=1.7"]
dev = ["mkdocs-material>=9.5", "mkdocs-static-i18n>=1.2", "pyyaml>=6.0",
       "nbformat>=5.9", "python-pptx>=0.6.23"]

[project.urls]
Homepage = "https://stg17-africa.github.io/stg17-workshop/"
Repository = "https://github.com/STG17-Africa/stg17-workshop"

[tool.setuptools]
packages = ["stg17"]

[tool.ruff]
line-length = 100
target-version = "py39"
