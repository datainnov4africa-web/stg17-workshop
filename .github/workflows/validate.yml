# Everything that must be true before material reaches a participant.
name: Validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: pip install -r requirements-dev.txt

      # The country registry is the single point of failure for every
      # geospatial laboratory: a malformed bbox silently drops territory.
      - name: Country registry self-check
        run: python -m stg17.countries

      # Generated notebooks must match their masters. If they do not, someone
      # edited a published file directly and their change will be lost on the
      # next build.
      - name: Notebooks are in sync with their masters
        run: python tools/build_notebooks.py --check

      - name: Notebooks are valid and carry no secrets
        run: python tools/check_notebooks.py

      - name: Site pages are in sync with the agenda
        run: |
          python tools/build_site.py
          git diff --exit-code docs/ || \
            (echo "::error::docs/ is stale. Run: python tools/build_site.py" && exit 1)

      - name: Slide decks build
        run: python tools/build_slides.py

      # The prompt library reads build_slides' thresholds and the palette
      # directly, so a rename in either breaks prompt assembly silently — the
      # tool would still print a prompt, just one carrying stale values. Assemble
      # one prompt of each shape and fail on any token left unresolved.
      - name: Prompt library assembles
        run: |
          python tools/prompt.py --list
          for p in P1 P6 P7; do
            python tools/prompt.py $p --deck 01 >/dev/null 2>err.txt
            test -s err.txt && (echo "::error::$p left tokens unresolved" && cat err.txt && exit 1)
          done
          python tools/prompt.py P2 --deck 01 --slide 3 >/dev/null
          python tools/prompt.py P8 --deck 08 --slide 5 >/dev/null

      - name: Site builds strictly
        run: mkdocs build --strict
