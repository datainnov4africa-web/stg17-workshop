# Build and publish the workshop site to GitHub Pages.
#
# The build regenerates the agenda pages, the laboratory register and the
# glossary first, so the published site can never be out of date with
# config/agenda.yml. If a source file changed and the generated page did not,
# --strict makes the build fail rather than publish a stale page.
name: Publish site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # 3.12 — see the note in validate.yml. The two must stay in step:
          # this job runs build_all.py, which runs the same notebook check.
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -r requirements-dev.txt

      - name: Regenerate everything derived
        run: python tools/build_all.py

      - name: Build site
        run: mkdocs build --strict

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
